<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Mouton Family</title>
<style>:root{--green:#1f8a78;--orange:#f7941d;--red:#ef233c;--blue:#285392;--paper:#f4efe5;--ink:#243228}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #dfe5da;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 12px 30px #0001}h1,h2,h3{margin:0 0 10px}button,input{font:inherit}button{border:0;border-radius:14px;padding:14px 16px;font-weight:800;touch-action:manipulation;cursor:pointer}.primary{background:#3f7254;color:#fff}.secondary{background:#eaf0e7;color:#24452f}.danger{background:#f8e1df;color:#963c35}.success{background:#dff0e2;color:#245c35}.full{width:100%}input{width:100%;padding:13px;border:1px solid #d9dfd5;border-radius:12px;background:#fff}.team{display:flex;gap:8px;margin:8px 0}.team input{flex:1}.team button{width:48px;padding:0}.hidden{display:none!important}.scoreboard{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.score{min-width:140px;padding:12px;border-radius:14px;background:#edf2eb;border:2px solid transparent}.score.active{border-color:#3f7254}.question-card{color:#fff;text-align:center;min-height:380px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.question-card.d1{background:var(--green)}.question-card.d2{background:var(--orange)}.question-card.d3{background:var(--red)}.question-card.dL{background:var(--blue)}.badge{display:inline-block;background:#ffffff26;padding:8px 12px;border-radius:999px;font-weight:900;margin:auto}.q{font-size:clamp(28px,7vw,48px);line-height:1.08;font-weight:900;margin:24px 0}.sub{font-size:17px;opacity:.95}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pot{font-weight:900;margin:10px 0}.lightning-list{display:grid;gap:10px;text-align:left;margin:18px 0}.lightning-item{padding:12px;border-radius:12px;background:#ffffff18;font-size:clamp(20px,5vw,30px);font-weight:900}.meta{font-size:14px;opacity:.72}.next-preview{margin:14px 0;padding:14px;border-radius:14px;font-weight:900;text-align:center;color:#fff}.next-preview.d1{background:var(--green)}.next-preview.d2{background:var(--orange)}.next-preview.d3{background:var(--red)}.next-preview.dL{background:var(--blue)}@media(max-width:520px){.actions{grid-template-columns:1fr}}</style>
</head><body><div class="app">
<section id="setup"><div class="card"><h1>🐑 Mouton Family</h1><p>Vert = 1 point • Orange = 2 • Rouge = 3 • Bleu = Éclair.</p><p id="cardCount" class="meta"></p></div><div class="card"><h3>Équipes</h3><div id="teams"></div><button id="add" class="secondary full">+ Ajouter une équipe</button></div><div class="card"><p><strong>Objectif :</strong> 7 points.</p><button id="start" class="primary full">Lancer la partie</button></div></section>
<section id="game" class="hidden"><div id="scores" class="scoreboard"></div><div id="questionCard" class="card question-card d1"><div id="badge" class="badge"></div><div id="teamname"></div><div id="question" class="q"></div><div id="lightning" class="lightning-list hidden"></div><div id="instruction" class="sub"></div><button id="play" class="full" style="margin-top:16px">Jouer la carte</button></div><div id="result" class="card hidden"><div id="pot" class="pot"></div><h3 id="resultTitle"></h3><div class="actions"><button id="no" class="danger">Non</button><button id="yes" class="success">Oui</button></div></div><div id="choice" class="card hidden"><h3>Carte réussie !</h3><div id="choiceText" class="pot"></div><div id="nextPreview" class="next-preview"></div><p class="meta">Comme avec la pioche physique, vous connaissez la valeur/type de la prochaine carte avant de décider, mais pas son thème.</p><div class="actions"><button id="bank" class="success">Encaisser</button><button id="continue" class="primary">Tenter cette carte</button></div></div></section>
<section id="win" class="hidden"><div class="card" style="text-align:center"><div style="font-size:52px">🎉🐑🎉</div><h2 id="winner"></h2><button id="rematch" class="primary">Revanche</button></div></section></div>
<script src="./cards-one.js"></script><script src="./cards-two.js"></script><script src="./cards-three.js"></script><script src="./cards-lightning.js"></script>
<script>
const one=window.SHEEP_ONE,two=window.SHEEP_TWO,three=window.SHEEP_THREE,lightning=window.SHEEP_LIGHTNING,$=id=>document.getElementById(id),state={teams:[],active:0,current:null,next:null,used:new Set(),turnPoints:0};
$('cardCount').textContent=`${one.length+two.length+three.length+lightning.length} thèmes originaux • Éclairs plus fréquents`;
function addTeam(name){const row=document.createElement('div');row.className='team';row.innerHTML='<input placeholder="Nom de l’équipe"><button class="danger">✕</button>';row.querySelector('input').value=name||'';row.querySelector('button').onclick=()=>{if($('teams').children.length>2)row.remove()};$('teams').appendChild(row)}addTeam('Les Bêêêles');addTeam('Les Frisés');$('add').onclick=()=>addTeam('Équipe '+($('teams').children.length+1));
function show(id){['setup','game','win'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}function sample(arr,n){const copy=[...arr],out=[];while(out.length<n&&copy.length)out.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]);return out}
function randomNormalCard(){const r=Math.random(),d=r<.38?1:r<.72?2:3,pool=d===1?one:d===2?two:three;let idx,key;do{idx=Math.floor(Math.random()*pool.length);key=`${d}:${idx}`}while(state.used.has(key)&&state.used.size<one.length+two.length+three.length);state.used.add(key);return{d,q:pool[idx]}}
function draw(){return Math.random()<.30?{d:'L',questions:sample(lightning,4)}:randomNormalCard()}function ensureNext(){if(!state.next)state.next=draw()}function takeNext(){ensureNext();state.current=state.next;state.next=null;ensureNext()}
function renderScores(){$('scores').innerHTML=state.teams.map((t,i)=>`<div class="score ${i===state.active?'active':''}"><strong>${t.name}</strong><br>${t.score} point${t.score>1?'s':''}</div>`).join('');$('teamname').innerHTML='<strong>Équipe active : '+state.teams[state.active].name+'</strong>'}
function nextLabel(c){return c.d==='L'?'⚡ Prochaine carte : ÉCLAIR • 1 point':`🐑 Prochaine carte : ${c.d} point${c.d>1?'s':''}`}
function nextCard(){takeNext();const d=state.current.d;$('questionCard').className='card question-card d'+d;$('badge').textContent=d==='L'?'⚡ ÉCLAIR — 1 point':`🐑 ${d} point${d>1?'s':''}`;$('question').classList.toggle('hidden',d==='L');$('lightning').classList.toggle('hidden',d!=='L');if(d==='L'){$('lightning').innerHTML=state.current.questions.map((q,i)=>`<div class="lightning-item">${i+1}. ${q}</div>`).join('');$('instruction').textContent='Enchaînez les 4 thèmes du tac au tac, sans « 1, 2, 3 ». Les 4 doivent être réussis.'}else{$('question').textContent=state.current.q;$('instruction').textContent='Réfléchissez en silence, puis « 1, 2, 3 » et réponse simultanée.'}$('play').classList.remove('hidden');$('result').classList.add('hidden');$('choice').classList.add('hidden');renderScores()}
function currentValue(){return state.current.d==='L'?1:Number(state.current.d)}function passTurn(){state.turnPoints=0;state.active=(state.active+1)%state.teams.length;nextCard()}function bankAndCheck(){const t=state.teams[state.active];t.score+=state.turnPoints;state.turnPoints=0;if(t.score>=7){$('winner').textContent=`${t.name} gagne avec ${t.score} points !`;show('win');return}state.active=(state.active+1)%state.teams.length;nextCard()}
$('start').onclick=()=>{state.teams=[...$('teams').querySelectorAll('input')].map((x,i)=>({name:x.value.trim()||'Équipe '+(i+1),score:0}));state.active=0;state.turnPoints=0;state.used.clear();state.next=null;show('game');nextCard()};$('play').onclick=()=>{$('play').classList.add('hidden');$('result').classList.remove('hidden');$('pot').textContent=state.turnPoints?`Déjà ${state.turnPoints} point${state.turnPoints>1?'s':''} en jeu sur ce tour.`:'Aucun point encore sécurisé sur ce tour.';$('resultTitle').textContent=state.current.d==='L'?'Les 4 thèmes ont-ils été réussis sans faute ?':'Les réponses sont-elles exactement les mêmes ?'};$('no').onclick=()=>passTurn();$('yes').onclick=()=>{state.turnPoints+=currentValue();$('result').classList.add('hidden');$('choice').classList.remove('hidden');ensureNext();$('choiceText').textContent=`${state.turnPoints} point${state.turnPoints>1?'s':''} en jeu. Encaisser ou tenter encore ?`;$('nextPreview').className='next-preview d'+state.next.d;$('nextPreview').textContent=nextLabel(state.next)};$('bank').onclick=()=>bankAndCheck();$('continue').onclick=()=>{$('choice').classList.add('hidden');nextCard()};$('rematch').onclick=()=>{state.teams.forEach(t=>t.score=0);state.active=0;state.turnPoints=0;state.used.clear();state.next=null;show('game');nextCard()};
</script></body></html>
