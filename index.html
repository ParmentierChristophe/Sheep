<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Mouton Family</title><style>*{box-sizing:border-box}body{margin:0;background:#f4efe5;color:#243228;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #dfe5da;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 12px 30px #0001}h1,h2,h3{margin:0 0 10px}button,input,select{font:inherit}button{border:0;border-radius:14px;padding:14px 16px;font-weight:800;touch-action:manipulation}.primary{background:#3f7254;color:white}.secondary{background:#eaf0e7;color:#24452f}.danger{background:#f8e1df;color:#963c35}.success{background:#dff0e2;color:#245c35}.full{width:100%}input,select{width:100%;padding:13px;border:1px solid #d9dfd5;border-radius:12px;background:white}.team{display:flex;gap:8px;margin:8px 0}.team input{flex:1}.team button{width:48px;padding:0}.hidden{display:none!important}.scoreboard{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.score{min-width:140px;padding:12px;border-radius:14px;background:#edf2eb;border:2px solid transparent}.score.active{border-color:#3f7254}.question{text-align:center;min-height:360px;display:flex;flex-direction:column;justify-content:center}.badge{display:inline-block;background:#f3e5b1;padding:8px 12px;border-radius:999px;font-weight:900;margin:auto}.q{font-size:clamp(30px,8vw,54px);line-height:1.05;font-weight:900;margin:24px 0}.timer{font-size:54px;font-weight:900;color:#c8584e}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:520px){.actions{grid-template-columns:1fr}}</style></head><body><div class="app"><section id="setup"><div class="card"><h1>🐑 Mouton Family</h1><p>320 cartes originales • jouable sur mobile</p></div><div class="card"><h3>Équipes</h3><div id="teams"></div><button id="add" class="secondary full">+ Ajouter une équipe</button></div><div class="card"><label>Objectif</label><select id="target"><option>10</option><option selected>15</option><option>20</option></select><button id="start" class="primary full" style="margin-top:12px">Lancer la partie</button></div></section><section id="game" class="hidden"><div id="scores" class="scoreboard"></div><div class="card question"><div id="badge" class="badge"></div><div id="teamname"></div><div id="question" class="q"></div><div id="timer" class="timer hidden">5</div><button id="reveal" class="primary">Afficher les choix</button></div><div id="result" class="card hidden"><h3>Les réponses correspondent-elles ?</h3><div class="actions"><button id="no" class="danger">Non — 0</button><button id="yes" class="success">Oui</button></div></div></section><section id="win" class="hidden"><div class="card" style="text-align:center"><div style="font-size:52px">🎉🐑🎉</div><h2 id="winner"></h2><button id="rematch" class="primary">Revanche</button></div></section></div><script>const one=["Blanc comme…","Fort comme…","Rusé comme…","Fier comme…","Doux comme…","Lent comme…","Rapide comme…","Muet comme…","Têtu comme…","Froid comme…","Le Père…","La Belle et…","Les trois petits…","Le Petit…","Il était une…","Bon appétit et…","Un fruit rouge","Un animal de la ferme","Un sport avec un ballon","Une boisson chaude","Un ingrédient de pizza","Une couleur de voiture","Un objet de cuisine","Une pièce de la maison","Un pays d’Europe","Un animal qui vole","Un métier en uniforme","Un personnage de Disney","Un jeu de société connu","Un dessert au chocolat","Une chose qu’on emmène à la plage","Une chose qu’on met dans un sandwich","Une marque de voiture","Un super-héros","Une fleur","Un légume vert","Un animal marin","Une matière scolaire","Un mois de l’année","Un jour du week-end","Une chose qu’on trouve dans un frigo","Une chose qu’on met sur une tartine","Un objet rond","Une chose qu’on trouve dans une salle de bain","Un mo hose qu’on met dans une soupe","Une chose qu’on trouve dans un fast-food","Une chose qu’on fait avant une photo"];const three=["La première chose à acheter si vous gagnez au loto","L’objet le plus utile sur une île déserte","La qualité la plus importante chez un ami","Une invention dont il serait difficile de se passer","Le pays à visiter une fois dans sa vie","Le personnage de fiction à inviter à dîner","L’époque où vous n’aimeriez pas vivre","Un métier qui pourrait disparaître","Le sort magique le plus utile dans la vraie vie","L’animal qui représenterait le mieux votre famille","La première chose à sauver lors d’un incendie","Quelque chose qui rend immédiatement heureux","Une règle que tout le monde devrait respecter","L’émission dans laquelle vous auriez le plus de chances de gagner","Une chose à faire si vous pouviez arrêter le temps","Une personne célèbre que tout le monde reconnaît","La matière scolaire la plus utile","Le métier que beaucoup d’enfants rêvent de faire","La recette d’une journée parfaite","Le meilleur super-pouvoir","Une invention inutile mais amusante","La chose la plus importante dans une maison","Le meilleur endroit pour vivre","Le pire endroit pour être bloqué","Une chose que tout le monde devrait apprendre","Le meilleur conseil à donner à un enfant","Une chose qui devrait être gratuite","Une chose qu’on devrait interdire","Le meilleur moyen de devenir célèbre","Le pire métier au monde","La meilleure façon de dépenser 1000 euros","Le meilleur animal à avoir en très grand","Le pire pouvoir magique","La chose la plus difficile à pardonner","Le meilleur souvenir à créer en famille","Le plus grand luxe du quotidien","La chose la plus importante dans un couple","Le meilleur moyen de se détendre","Une chose qu’on regrette souvent de ne pas avoir faite","Une chose qu’on voudrait apprendre instantanément","Une destination parfaite pour un week-end","La meilleure invention du futur","La pire invention moderne","Le meilleur âge de la vie","Le pire mo ut vient à point…","Une hirondelle ne fait pas…","Pas de nouvelles…","Faute avouée…","Le jeu n’en vaut pas…","Rira bien…","Les bons comptes font…","Qui sème le vent…","Il n’y a pas de fumée…","L’habit ne fait pas…","C’est la goutte d’eau…","Mettre la charrue…","Il faut battre le fer…","Quand on parle du loup…","Les chiens ne font pas…","L’union fait…","La parole est d’argent…","Qui ne tente rien…","Aide-toi…","À cœur vaillant…","Nul n’est prophète…","Le temps, c’est…","L’espoir fait…","À chaque jour…","Après l’effort…","Qui aime bien…","Il n’y a que la vérité…","Chat échaudé…","C’est en forgeant…","Qui vivra…","Plus on est de fous…","Le malheur des uns…","On ne fait pas d’omelette…","Qui vole un œuf…","Mieux vaut prévenir…","L’argent ne fait pas…","Les absents ont toujours…","Tout est bien…","Il faut de tout…","Ce qui est fait…","À quelque chose malheur…","Il n’est jamais trop tard…","Qui peut le plus…","Le mieux est l’ennemi…","À malin…","Il faut tourner sept fois…","Les petits ruisseaux font…","Ventre affamé…","Chaque chose en son temps…","Nécessité fait…","La curiosité est…","À l’impossible…","Les paroles s’envolent…","Qui se ressemble…","Le silence est…","La vérité sort…","Une de perdue…","C’est l’intention qui…","Les opposés…","Le cœur a ses raisons…","Quand il n’y en a plus…","Il vaut mieux être seul…"];const CARDS=[...one.map(q=>({d:1,q})),...two.map(q=>({d:2,q})),...three.map(q=>({d:3,q})),...lightning.map(q=>({d:'L',q}))];const $=id=>document.getElementById(id),state={teams:[],active:0,target:15,current:null,used:[],timer:null};function addTeam(name){const row=document.createElement('div');row.className='team';row.innerHTML='<input placeholder="Nom de l’équipe"><button class="danger">✕</button>';row.querySelector('input').value=name||'';row.querySelector('button').onclick=()=>{if($('teams').children.length>2)row.remove()};$('teams').appendChild(row)}addTeam('Les Bêêêles');addTeam('Les Frisés');$('add').onclick=()=>addTeam('Équipe '+($('teams').children.length+1));function show(id){['setup','game','win'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}function draw(){if(state.used.length>=CARDS.length)state.used=[];let i;do{i=Math.floor(Math.random()*CARDS.length)}while(state.used.includes(i));state.used.push(i);return CARDS[i]}function render(){$('scores').innerHTML=state.teams.map((t,i)=>`<div class="score ${i===state.active?'active':''}"><strong>${t.name}</strong><br>${t.score} 🐑</div>`).join('');$('teamname').innerHTML='<strong>Équipe active : '+state.teams[state.active].name+'</strong>'}function next(){clearInterval(state.timer);state.current=draw();const d=state.current.d;$('badge').textContent=d==='L'?'⚡ ÉCLAIR':'🐑'.repeat(d);$('question').textContent=state.current.q;$('reveal').textContent=d==='L'?'Démarrer l’Éclair':'Afficher les choix';$('reveal').disabled=false;$('result').classList.add('hidden');$('timer').classList.add('hidden');$('yes').textContent='Oui — +'+(d==='L'?2:d)+' 🐑';render()}$('start').onclick=()=>{state.teams=[...$('teams').querySelectorAll('input')].map((x,i)=>({name:x.value.trim()||'Équipe '+(i+1),score:0}));state.target=+$('target').value;state.active=0;state.used=[];show('game');next()};$('reveal').onclick=()=>{$('reveal').disabled=true;if(state.current.d==='L'){let n=5;$('timer').textContent=n;$('timer').classList.remove('hidden');state.timer=setInterval(()=>{n--;$('timer').textContent=n;if(n<=0){clearInterval(state.timer);$('result').classList.remove('hidden')}},1000)}else $('result').classList.remove('hidden')};function advance(p){state.teams[state.active].score+=p;if(state.teams[state.active].score>=state.target){$('winner').textContent=state.teams[state.active].name+' gagne avec '+state.teams[state.active].score+' moutons !';show('win');return}state.active=(state.active+1)%state.teams.length;next()}$('no').onclick=()=>advance(0);$('yes').onclick=()=>advance(state.current.d==='L'?2:+state.current.d);$('rematch').onclick=()=>{state.teams.forEach(t=>t.score=0);state.active=0;state.used=[];show('game');next()};</script></body></html>
