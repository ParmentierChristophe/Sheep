name: Validate game

on:
  push:
    paths:
      - 'cards-*.js'
      - 'validate-cards.mjs'
      - 'game-engine.js'
      - 'game-engine.test.mjs'
      - 'app.js'
      - 'styles.css'
      - 'index.html'
      - '.github/workflows/validate-cards.yml'
  pull_request:
    paths:
      - 'cards-*.js'
      - 'validate-cards.mjs'
      - 'game-engine.js'
      - 'game-engine.test.mjs'
      - 'app.js'
      - 'styles.css'
      - 'index.html'
      - '.github/workflows/validate-cards.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate card banks
        run: node validate-cards.mjs
      - name: Test game engine
        run: node game-engine.test.mjs
